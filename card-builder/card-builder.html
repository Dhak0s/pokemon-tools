<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='6' width='44' height='52' rx='6' fill='%23f5f5ff' stroke='%231a1464' stroke-width='4'/%3E%3Cpath d='M16 16h32' stroke='%231a1464' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='28' r='5' fill='%23cc0000'/%3E%3Cpath d='M31 26h13M31 34h13M18 45h28' stroke='%235e35b1' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Pokémon Card Builder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: #e8eaf6;
    padding: 16px;
    min-height: 100vh;
    font-family: 'Nunito Sans', sans-serif;
    display: flex;
    justify-content: center;
    box-sizing: border-box;
  }

  .page-layout {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  /* HEADER NAME OVERLAY */
  .header-title-wrapper {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    overflow: visible;
  }
  .header-search-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .header-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 8px;
    color: rgba(255,255,255,0.45);
    font-family: 'Nunito', sans-serif;
    font-size: clamp(11px, 2.7vw, 18px);
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1.15;
    text-align: center;
    text-transform: none;
    pointer-events: none;
    opacity: 1;
  }
  .header-placeholder-mobile-break {
    display: none;
  }
  /* Input invisible by default — name shows through */
  .header-search-input {
    width: 100%;
    height: 100%;
    min-height: 52px;
    background: transparent;
    border: none;
    outline: none;
    color: transparent;
    caret-color: transparent;
    font-family: 'Nunito', sans-serif;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 3px;
    text-align: center;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0;
    box-sizing: border-box;
  }
  /* While editing: show input text, hide the static name beneath */
  .header-title-wrapper.editing .header-search-input {
    color: white;
    caret-color: white;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
    outline: 2px solid rgba(255,255,255,0.5);
  }
  .header-title-wrapper.editing #pokemonName {
    visibility: hidden;
  }
  /* Placeholder always transparent — only show when no pokemon loaded and not editing */
  .header-search-input::placeholder {
    color: transparent;
    font-size: 18px;
    letter-spacing: 1px;
    font-weight: 700;
    text-transform: none;
  }
  /* Show placeholder only when no pokemon is loaded yet */
  .header-title-wrapper:not(.loaded):not(.editing) .header-search-input::placeholder {
    color: transparent;
  }
  .header-title-wrapper.loaded .header-placeholder,
  .header-title-wrapper.editing .header-placeholder {
    opacity: 0;
  }
  .header-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    width: 100%;
    border-radius: 8px !important;
    border-top: 2px solid #5e35b1 !important;
    z-index: 500;
  }
  .notes-print-area {
    position: absolute;
    inset: 0;
    display: flex !important;
    align-items: center;
    justify-content: center;
    padding: 8px;
    pointer-events: none;
  }
  .notes-print-btn {
    pointer-events: all;
    background: #1a1464;
    color: white;
    border: none;
    border-radius: 12px;
    max-width: 100%;
    max-height: 100%;
    padding: 18px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 22px;
    font-weight: 900;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 4px 16px rgba(26,20,100,0.35);
    transition: background 0.15s, transform 0.1s;
  }
  .notes-print-btn:hover {
    background: #2d24a0;
    transform: scale(1.04);
  }
  .notes-print-btn:focus {
    outline: 4px solid #f6c400;
    outline-offset: 3px;
    background: #2d24a0;
    transform: scale(1.04);
  }
  .notes-print-btn:active {
    transform: scale(0.97);
  }
  .edit-overlay {
    display: none;
  }
  body:not(.print-mode) .edit-overlay {
    display: block;
  }
.dropdown-wrapper {
    position: relative;
  }
.move-card {
    position: relative;
  }
  .loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(26, 20, 100, 0.35);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
}

.loading-overlay.active {
  display: flex;
}

.loading-message {
  min-height: 48px;
  max-width: min(320px, calc(100vw - 32px));
  color: white;
  font-family: 'Nunito', sans-serif;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 0.5px;
  line-height: 1.25;
  text-align: center;
  text-shadow: 0 2px 8px rgba(0,0,0,0.45);
  opacity: 0;
}

.loading-message.visible {
  opacity: 1;
}

.loading-spinner {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(180deg, #cc0000 50%, white 50%);
  border: 4px solid #111;
  position: relative;
  animation: pokeball-spin 0.9s linear infinite;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

/* Centre dividing line */
.loading-spinner::before {
  content: '';
  position: absolute;
  left: -4px; right: -4px;
  top: 50%; transform: translateY(-50%);
  height: 5px;
  background: #111;
}

/* Centre button */
.loading-spinner::after {
  content: '';
  position: absolute;
  width: 18px; height: 18px;
  background: white;
  border-radius: 50%;
  border: 4px solid #111;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
}

@keyframes pokeball-spin {
  to { transform: rotate(360deg); }
}

  /* CARD STYLES */
  .card {
    background: #f5f5ff;
    border-radius: 20px;
    border: 5px solid #1a1464;
    width: 100%;
    max-width: 720px;
    padding: 12px;
    box-shadow: 0 8px 32px rgba(26,20,100,0.18);
    box-sizing: border-box;
  }
  .header {
    background: #1a1464;
    border-radius: 12px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    position: relative;
    overflow: visible;
  }
  .pokeball {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: white;
    border: 3px solid #cc0000;
    position: relative;
    flex-shrink: 0;
  }
  .pokeball::before {
    content: '';
    position: absolute;
    width: 100%; height: 50%;
    background: #cc0000;
    border-radius: 36px 36px 0 0;
    top: 0;
  }
  .pokeball::after {
    content: '';
    position: absolute;
    width: 10px; height: 10px;
    background: white;
    border-radius: 50%;
    border: 2px solid #aaa;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    z-index: 2;
  }
  .header-title {
    font-family: 'Nunito', sans-serif;
    font-size: 38px;
    font-weight: 900;
    color: white;
    letter-spacing: 3px;
    text-shadow: 3px 3px 0 #0d0b5e;
    -webkit-text-stroke: 1px #0d0b5e;
    flex: 1;
    text-align: center;
    text-transform: uppercase;
  }
  .body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .left-col, .right-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .right-col {
    height: 100%;
  }
  .artwork-area {
    background: radial-gradient(circle at 50% 55%, #ede8ff 30%, #c8b8f8 100%);
    border-radius: 14px;
    height: 210px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #c5b8f5;
    overflow: hidden;
  }
  .artwork-area img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 8px;
    filter: drop-shadow(0 4px 10px rgba(70,40,180,0.3));
  }
  .type-row {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .type-icon-lg {
    height: 28px;
  }
  .section-header {
    background: #1a1464;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1.5px;
    padding: 4px 10px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .star-icon {
    color: #ffd700;
  }
  .section-box {
    background: white;
    border-radius: 12px;
    border: 2px solid #c8caff;
    padding: 8px 10px;
  }
  .ability-name {
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 900;
    color: #1a1464;
    margin-bottom: 3px;
  }
  .ability-desc {
    font-size: 12px;
    color: #555;
    line-height: 1.4;
  }
  .stat-row {
    display: grid;
    grid-template-columns: 76px 36px 1fr;
    align-items: center;
    gap: 6px;
    margin: 4px 0;
  }
  .stat-label {
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    color: #333;
    letter-spacing: 0.5px;
  }
  .stat-label.no-nature {
    cursor: default;
  }
  .stat-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .stat-val {
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: #1a1464;
    text-align: right;
    position: relative;
    min-width: 36px;
    height: 18px;
  }
  .stat-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    color: transparent;
    font: inherit;
    text-align: right;
    cursor: pointer;
    appearance: textfield;
    -moz-appearance: textfield;
  }

  .stat-input::-webkit-outer-spin-button,
  .stat-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .stat-bar-bg {
    height: 9px;
    background: #ddd;
    border-radius: 5px;
    overflow: visible;
    position: relative;
    min-width: 0;
    margin-left: 1em;
  }
  .stat-bar-fill {
    height: 100%;
    border-radius: 5px;
  }
.ev-click-zone::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -6px;
  bottom: -6px;
  z-index: 2;
}

.ev-click-zone .stat-bar-fill,
.ev-click-zone .ev-badge {
  position: relative;
  z-index: 3;
}
  .move-card {
    background: white;
    border-radius: 10px;
    border: 2px solid #c8caff;
    padding: 7px 9px;
    margin-bottom: 6px;
    position: relative;
    min-height: 80px;
  }
  #defensiveMatchups {
    min-height: 120px;
  }
  .move-header {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 4px;
  }
  .move-icon {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .move-name {
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 900;
    color: #1a1464;
    flex: 1;
    text-transform: uppercase;
  }
  .move-badges {
    display: flex;
    gap: 3px;
    align-items: center;
  }
  .move-cat-badge {
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    color: white;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .cat-physical { background: #c03028; }
  .cat-special { background: #7038F8; }
  .cat-status { background: #888; }
  .move-stats-desc {
    display: flex;
    gap: 8px;
    margin-bottom: 5px;
    align-items: flex-start;
  }
  .move-pwr-acc {
    display: flex;
    gap: 12px;
  }
  .pwr-acc-block {
    text-align: center;
  }
  .pwr-acc-label {
    font-size: 9px;
    font-weight: 700;
    color: #888;
    letter-spacing: 0.5px;
    display: block;
  }
  .pwr-acc-val {
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: #1a1464;
    display: block;
  }
  .move-desc-text {
    font-size: 10.5px;
    color: #555;
    line-height: 1.4;
    flex: 1;
  }
  .move-matchups {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 5px;
    margin-top: 5px;
    border-top: 1px solid #eee;
    padding-top: 5px;
  }
  .matchup-col-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.4px;
    margin-bottom: 4px;
  }
  .ml-strong { color: #1a6e1a; }
  .ml-resist { color: #b00020; }
  .ml-noeff { color: #666; }
  .matchup-icons {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
  }
  .matchup-icons img {
    height: 16px;
  }
  .status-note {
    font-size: 9px;
    color: #999;
    font-style: italic;
  }
  .no-eff-dash {
    font-size: 12px;
    color: #bbb;
  }
  .def-matchup-block {
    margin-bottom: 6px;
  }
  .def-matchup-header {
    color: white;
    font-size: 12px;
    font-weight: 800;
    padding: 4px 10px 2px;
    border-radius: 6px 6px 0 0;
    letter-spacing: 0.5px;
    text-align: center;
  }
  .def-matchup-sub {
    font-size: 9px;
    font-weight: 400;
    opacity: 0.85;
    display: block;
    margin-bottom: 1px;
  }
  .weak-header { background: #cc2222; }
  .resist-header { background: #1a7a1a; }
  .immune-header { background: #2244aa; }
  .def-matchup-types {
    border: 2px solid #ddd;
    border-top: none;
    border-radius: 0 0 6px 6px;
    padding: 6px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    min-height: 36px;
    background: #fafafa;
    align-items: center;
  }
  .def-matchup-types img {
    height: 24px;
  }
  .notes-box {
    border: 2px dashed #aaa;
    border-radius: 10px;
    padding: 8px 10px;
    min-height: 80px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .notes-label { display: none; }

  @media print {
    .notes-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #888;
      letter-spacing: 1px;
      text-align: center;
      padding-bottom: 6px;
      flex-shrink: 0;
    }
  }
.stat-label {
  cursor: pointer;
}

.nature-up {
  color: #1a9b3f;
  font-size: 10px;
  margin-left: 3px;
}

.nature-down {
  color: #cc2222;
  font-size: 10px;
  margin-left: 3px;
}
.ev-click-zone {
  position: relative;
  cursor: pointer;
}

.ev-click-zone.ev-maxed {
  outline: 3px solid #1a9b3f;
  box-shadow: inset 0 0 0 1px rgba(26,155,63,0.3);
}

.ev-click-zone.ev-remainder {
  outline: 2px solid #f0c000;
}

.ev-badge {
  position: absolute;
  right: 4px;
  top: -15px;
  font-size: 9px;
  font-weight: 800;
  color: #1a1464;
  background: #fffbe0;
  border: 1px solid #d8c800;
  border-radius: 4px;
  padding: 0 3px;
}

  /* MOVE SEARCH COMBOBOX */
  .move-search-wrapper {
    position: relative;
    width: 100%;
    margin-bottom: 5px;
  }
  .move-search-input {
    width: 100%;
    padding: 5px 10px;
    border: 2px solid #c8caff;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'Nunito Sans', sans-serif;
    background: #f0f0ff;
    color: #1a1464;
    box-sizing: border-box;
  }
  .move-search-input:focus {
    outline: none;
    border-color: #5e35b1;
    background: white;
  }
  .move-search-input::placeholder {
    color: #aaa;
    font-style: italic;
  }
  .move-dropdown-list {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: white;
    border: 2px solid #5e35b1;
    border-top: none;
    border-radius: 0 0 8px 8px;
    max-height: 190px;
    overflow-y: auto;
    z-index: 200;
    list-style: none;
    padding: 0;
    margin: 0;
    box-shadow: 0 6px 16px rgba(94,53,177,0.15);
  }
  .move-dropdown-list.open {
    display: block;
  }
  .move-dropdown-list li {
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    color: #1a1464;
    font-family: 'Nunito Sans', sans-serif;
  }
  .move-dropdown-list li:hover {
    background: #ede8ff;
  }
  .move-dropdown-list li.highlighted {
    background: #d4c9ff;
    font-weight: 700;
  }
  /* STAT FOCUS STYLES */
  .stat-label:focus {
    outline: 2px solid #5e35b1;
    border-radius: 4px;
    background: #f0eaff;
  }
  .ev-click-zone:focus {
    outline: 2px solid #5e35b1;
    border-radius: 5px;
  }
  .stat-input:focus {
    color: #1a1464 !important;
    background: rgba(255,255,255,0.97) !important;
    outline: 2px solid #5e35b1;
    border-radius: 3px;
    z-index: 5;
  }

 /* PRINT STYLES */
  /* ── RESPONSIVE / MOBILE ───────────────────────────────────── */

  /* Tablet — two columns still fine but tighten up */
  @media (max-width: 760px) {
    body { padding: 10px; }

    .card {
      border-radius: 14px;
      border-width: 4px;
      padding: 8px;
    }

    .header { padding: 6px 10px; }

    .header-title {
      font-size: 28px;
      letter-spacing: 2px;
    }

    .header-search-input {
      font-size: 28px;
    }

    .pokeball { width: 28px; height: 28px; }

    .artwork-area { height: 160px; }
  }

  /* Mobile — single column layout */
  @media (max-width: 540px) {
    body { padding: 6px; }

    .card {
      border-radius: 12px;
      border-width: 3px;
      padding: 6px;
    }

    .header { padding: 5px 8px; margin-bottom: 6px; }

    .header-title {
      font-size: 22px;
      letter-spacing: 1px;
    }

    .header-search-input {
      font-size: 20px;
      min-height: 38px;
    }

    .header-search-input::placeholder {
      font-size: clamp(9px, 2.8vw, 13px);
      letter-spacing: 0.2px;
    }

    .header-placeholder {
      flex-direction: column;
      padding: 0 4px;
      font-size: clamp(9px, 2.8vw, 13px);
      letter-spacing: 0.2px;
    }

    .header-placeholder-mobile-break {
      display: none;
    }

    .header-title-wrapper { min-height: 38px; }

    .pokeball { width: 24px; height: 24px; }

    /* Stack columns vertically */
    .body {
      grid-template-columns: 1fr;
      gap: 6px;
    }

    /* Artwork smaller on phone */
    .artwork-area { height: 140px; }

    /* Move card tighter */
    .move-card {
      padding: 5px 7px;
      min-height: 60px;
      margin-bottom: 4px;
    }

    .move-name { font-size: 12px; }
    .move-desc-text { font-size: 9.5px; }

    /* Move matchups: stack to 1 col on very small */
    .move-matchups {
      grid-template-columns: 1fr;
      gap: 3px;
    }

    /* Stat row — shrink label column */
    .stat-row {
      grid-template-columns: calc(60px + 2em) 30px minmax(0, 1fr);
      gap: 4px;
    }

    /* Ability/item section */
    .ability-name { font-size: 15px; }
    .ability-desc { font-size: 11px; }

    /* Section header smaller */
    .section-header { font-size: 11px; padding: 3px 8px; }

    /* Defensive matchup icons */
    .def-matchup-types img { height: 18px; }

    /* Type icons in header */
    .type-icon-lg { height: 22px; }

    /* Notes box */
    .notes-box { min-height: 60px; }

    .notes-print-area {
      padding: 6px;
    }

    .notes-print-btn {
      width: min(100%, 150px);
      padding: 12px 18px;

<script>

let loadingMessageTimers = [];
let lastLoadingLoopMessage = '';
let loadingLoopMessageQueue = [];

const LOADING_LOOP_MESSAGES = [
  'Taking {pokemon} to daycare...',
  'Wandering in the tall grass...',
  'Surfing up and down the coast...',
  "Training EV's...",
  'Battling wild Pokémon...',
  'Visiting the Pokémon Center...',
  'Hatching eggs...'
];

function clearLoadingMessageTimers() {
  loadingMessageTimers.forEach(timer => {
    clearTimeout(timer);
    clearInterval(timer);
  });
  loadingMessageTimers = [];
}

function formatLoadingPokemonName(name) {
  const cleanName = String(name || '').trim();
  if (!cleanName) return 'Pokémon';

  return cleanName
    .split(/[\s-]+/)
    .filter(Boolean)
    .map(part => part.charAt(0).toUpperCase() + part.slice(1).toLowerCase())
    .join(' ');
}

function randomLoadingLoopMessage(pokemonName) {
  if (!loadingLoopMessageQueue.length) {
    loadingLoopMessageQueue = [...LOADING_LOOP_MESSAGES];

    for (let i = loadingLoopMessageQueue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [loadingLoopMessageQueue[i], loadingLoopMessageQueue[j]] = [loadingLoopMessageQueue[j], loadingLoopMessageQueue[i]];
    }

    if (loadingLoopMessageQueue.length > 1 && loadingLoopMessageQueue[0] === lastLoadingLoopMessage) {
      [loadingLoopMessageQueue[0], loadingLoopMessageQueue[1]] = [loadingLoopMessageQueue[1], loadingLoopMessageQueue[0]];
    }
  }

  const template = loadingLoopMessageQueue.shift();
  lastLoadingLoopMessage = template;
  return template.replace('{pokemon}', pokemonName);
}

function showLoading(pokemonName = 'Pokémon') {
  const overlay = document.getElementById('loadingOverlay');
  const message = document.getElementById('loadingMessage');
  const displayName = formatLoadingPokemonName(pokemonName);
  let elapsedSeconds = 0;

  clearLoadingMessageTimers();
  lastLoadingLoopMessage = '';
  loadingLoopMessageQueue = [];
  if (message) {
    message.textContent = `Loading ${displayName}'s data...`;
    message.classList.add('visible');
  }

  overlay.classList.add('active');

  const updateLoadingMessage = () => {
    if (!overlay.classList.contains('active') || !message) return;

    elapsedSeconds += 5;

    if (elapsedSeconds === 5) {
      message.textContent = `Finding ${displayName}'s moves...`;
    } else if (elapsedSeconds === 10) {
      message.textContent = 'Checking held items...';
    } else if (elapsedSeconds === 40) {
      message.textContent = 'A wild MissingNo. appeared!';
    } else {
      message.textContent = randomLoadingLoopMessage(displayName);
    }

    message.classList.add('visible');
  };

  loadingMessageTimers = [setInterval(updateLoadingMessage, 5000)];
}

function hideLoading() {
  const overlay = document.getElementById('loadingOverlay');
  const message = document.getElementById('loadingMessage');

  clearLoadingMessageTimers();
  overlay.classList.remove('active');
  if (message) {
    message.textContent = '';
    message.classList.remove('visible');
  }
}

async function loadPokemonNameList() {
  try {
    const response = await fetch('https://pokeapi.co/api/v2/pokemon?limit=2000');
    const data = await response.json();
    pokemonNameList = data.results.map(p => p.name);
  } catch (error) {
    console.error('Could not load Pokémon name list:', error);
  }
}

function startEditingPokemonName(preserveValue = false) {
  const input = document.getElementById('pokemonSearch');
  const wrapper = input.closest('.header-title-wrapper');
  wrapper.classList.add('editing');
  if (!preserveValue && !pendingShowdown) input.value = '';
}

function endEditingPokemonName() {
  setTimeout(() => {
    const input = document.getElementById('pokemonSearch');
    const wrapper = input.closest('.header-title-wrapper');
    wrapper.classList.remove('editing');
    input.value = ''; // always clear — name shows via #pokemonName
  }, 160); // slightly after dropdown close (150ms)
}

function filterPokemonDropdown(query) {
  const list = document.getElementById('pokemonDropdown');
  if (!list) return;
  const q = query.trim().toLowerCase();
  if (!q) { list.innerHTML = ''; list.classList.remove('open'); return; }
  const matches = pokemonNameList
    .filter(n => n.includes(q))
    .slice(0, 20);
  if (matches.length === 0) {
    list.innerHTML = `<li style="color:#aaa;font-style:italic;cursor:default;">No Pokémon found</li>`;
  } else {
    list.innerHTML = matches.map(n =>
      `<li onmousedown="event.preventDefault(); selectPokemonFromDropdown('${n}')">${n}</li>`
    ).join('');
  }
  list.classList.add('open');
}

function closePokemonDropdown() {
  const list = document.getElementById('pokemonDropdown');
  if (list) list.classList.remove('open');
}

function schedulePokemonDropdownClose() {
  setTimeout(() => closePokemonDropdown(), 150);
}

function selectPokemonFromDropdown(name) {
  const input = document.getElementById('pokemonSearch');
  if (input) input.value = name;
  closePokemonDropdown();
  loadPokemon();
}

function getSelectableDropdownItems(list) {
  return list ? [...list.querySelectorAll('li[data-index], li[onmousedown]')] : [];
}

function getHighlightedDropdownItem(list) {
  return getSelectableDropdownItems(list).find(item => item.classList.contains('highlighted'));
}

function moveDropdownHighlight(list, direction) {
  const items = getSelectableDropdownItems(list);
  if (!items.length) return false;

  const currentIndex = items.findIndex(item => item.classList.contains('highlighted'));
  const nextIndex = currentIndex === -1
    ? (direction > 0 ? 0 : items.length - 1)
    : (currentIndex + direction + items.length) % items.length;

  items.forEach(item => item.classList.remove('highlighted'));
  items[nextIndex].classList.add('highlighted');
  items[nextIndex].scrollIntoView({ block: 'nearest' });
  return true;
}

function handlePokemonSearchKey(event) {
  const list = document.getElementById('pokemonDropdown');
  const items = getSelectableDropdownItems(list);
  const highlightedItem = getHighlightedDropdownItem(list);

  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    if (moveDropdownHighlight(list, event.key === 'ArrowDown' ? 1 : -1)) {
      event.preventDefault();
    }
  } else if (event.key === 'Enter' || event.key === 'Tab') {
    const input = document.getElementById('pokemonSearch');
    const hasText = input && input.value.trim();
    if (hasText) {
      event.preventDefault();
      if (highlightedItem) {
        input.value = highlightedItem.textContent;
      // If exactly one dropdown match, snap that name in first
      } else if (items.length === 1) {
        input.value = items[0].textContent;
      }
      closePokemonDropdown();
      loadPokemon(); // will focus moveSearch1 on success
    }
    // If no text, let Tab fall through naturally to Load button
  } else if (event.key === 'Escape') {
    event.preventDefault();
    closePokemonDropdown();
  }
}

// Pattern-based rules applied before the static map lookup
function showdownSlugToPokeAPI(slug) {
  let s = slug.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');

  // Check static map first
  if (SHOWDOWN_FORM_MAP[s]) return SHOWDOWN_FORM_MAP[s];

  // Pattern rules for systematic mismatches
  // Gender: -f / -m at end of slug
  s = s.replace(/-f$/, '-female').replace(/-m$/, '-male');

  // Paldea breed forms: if slug ends in -combat/-blaze/-aqua and contains 'paldea'
  if (s.includes('paldea')) {
    s = s.replace(/-(combat|blaze|aqua)$/, '-$1-breed');
  }

  return s;
}
function parseShowdown(text) {
  const lines = text.trim().split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length < 3) return null;

  // Must have at least an Ability line to identify as Showdown format
  const hasAbility = lines.some(l => /^Ability:/i.test(l));
  if (!hasAbility) return null;

  // Line 0: "Name (Gender) @ Item" or "Name @ Item" or "Name"
  const line0 = lines[0];
  const atParts = line0.split('@');
  const nameSection = atParts[0].trim();
  const itemRaw = atParts[1] ? atParts[1].trim() : null;

  // "Nickname (Species) @ Item" — species is in parens, ignore gender (F)/(M)/(f)/(m)
  // "Sableye (F) @ Item" — no nickname, parens are just gender
  // "Sableye @ Item" — plain
  const speciesMatch = nameSection.match(/\(([^FM)][^)]*)\)/i) || // multi-char species in parens
                       nameSection.match(/\(([A-Z][a-z][^)]*)\)/); // capitalised species
  const rawName = speciesMatch
    ? speciesMatch[1].trim()          // use species inside parens
    : nameSection.replace(/\(.\)\s*/, '').trim(); // strip gender paren, use full name

  const nameLine = showdownSlugToPokeAPI(rawName.toLowerCase().replace(/\s+/g, '-'));

  const result = { name: nameLine, ability: null, item: itemRaw, shiny: false, evs: [0,0,0,0,0,0], natureMods: [1,1,1,1,1,1], moves: [] };

  for (const line of lines.slice(1)) {
    if (/^Ability:/i.test(line)) {
      result.ability = line.replace(/^Ability:\s*/i, '').trim().toLowerCase().replace(/\s+/g, '-');

    } else if (/^Shiny:\s*Yes/i.test(line)) {
      result.shiny = true;

    } else if (/^EVs:/i.test(line)) {
      // Normalize: collapse all whitespace variants (nbsp, tabs, multiple spaces) to single space
      const evStr = line.replace(/^EVs:\s*/i, '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ');
      for (const chunk of evStr.split('/')) {
        const parts = chunk.trim().split(/\s+/);
        if (parts.length < 2) continue;
        const amount = parseInt(parts[0], 10);
        if (isNaN(amount)) continue;
        const key = parts[1].toLowerCase().replace(/[^a-z]/g, '');
        const idx = EV_STAT_MAP[key];
        if (idx !== undefined) result.evs[idx] = amount;
      }

    } else if (/Nature$/i.test(line)) {
      const natureName = line.replace(/\s+Nature$/i, '').trim().toLowerCase();
      const mods = NATURE_MODS[natureName];
      if (mods) result.natureMods = [1, ...mods]; // index 0 = HP, always 1

    } else if (/^- /.test(line)) {
      const moveName = line.replace(/^- /, '').trim().toLowerCase().replace(/\s+/g, '-');
      result.moves.push(moveName);
    }
  }
  // Import EVs into the sheet's 0–32 stat-point scale.
  result.evs = convertImportedEVs(result.evs);
return result;
}

function handlePokemonPaste(event) {
  const text = (event.clipboardData || window.clipboardData).getData('text');

}

  6: 'rock', 7: 'bug', 8: 'ghost', 9: 'steel', 10: 'fire',

async function fetchPokemonWithFallback(slug) {
  const translated = showdownSlugToPokeAPI(slug);
  const attempts = [];

  // Start with translated form
  if (!attempts.includes(translated)) attempts.push(translated);
  // Also try original if different
  if (!attempts.includes(slug)) attempts.push(slug);
  // If contains paldea and doesn't end in -breed, try adding it
  if (translated.includes('paldea') && !translated.endsWith('-breed')) {
    attempts.push(translated + '-breed');
  }
  // Progressive suffix stripping
  let s = translated;
  while (s.includes('-')) {
    s = s.substring(0, s.lastIndexOf('-'));
    if (!attempts.includes(s)) attempts.push(s);
  }

  for (const attempt of attempts) {
    const r = await fetch(`https://pokeapi.co/api/v2/pokemon/${attempt}`);
    if (r.ok) return r.json();
  }
  throw new Error('Pokémon not found');
}

async function loadPokemon() {
  const rawInput = document.getElementById('pokemonSearch').value.trim();
  const input = rawInput.toLowerCase();
  if (!input) return;

  showLoading(rawInput);

  try {
    currentPokemon = await fetchPokemonWithFallback(showdownSlugToPokeAPI(input));

    // Shiny state — default off unless showdown says yes
    isShiny = pendingShowdown?.shiny ?? false;

    // Update basic info
    const displayName = currentPokemon.name.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    document.getElementById('pokemonName').textContent = displayName.toUpperCase();
    document.title = `${displayName} Card`;

    updateArtwork();

    // Update types
    updateTypes();

    // Load abilities
    await loadAbilities();

    // Load item
    if (pendingShowdown?.item) {
      await loadSingleItem(pendingShowdown.item);
    } else {
      await loadHeldItems();
    }

    // Reset stat customisations for the new Pokémon
    statEVs = [0, 0, 0, 0, 0, 0];
    statNatureMods = [1, 1, 1, 1, 1, 1];
    updateStats();

    // Load moves
    if (pendingShowdown && pendingShowdown.moves.length > 0) {
      await loadMovesFromShowdown(pendingShowdown.moves);
    } else {
      await loadMoves();
    }

    // Calculate defensive matchups
    updateDefensiveMatchups();

    // Apply Showdown import if pending
    if (pendingShowdown) {
      applyShowdownData(pendingShowdown);
      pendingShowdown = null;
      document.querySelector('.notes-print-btn')?.focus();
    } else {
      document.getElementById('moveSearch1')?.focus();
    }

    // Clear search input
    const searchInput = document.getElementById('pokemonSearch');
    searchInput.value = '';
    const wrapper = searchInput.closest('.header-title-wrapper');
    wrapper.classList.remove('editing');
    wrapper.classList.add('loaded');

  } catch (error) {
    alert('Pokémon not found! Please check the spelling and try again.');
  } finally {
    hideLoading();
  }
}

async function preloadHoldableItems() {
  try {
    const [r1, r2] = await Promise.all([
      fetch('https://pokeapi.co/api/v2/item-attribute/holdable-passive'),
      fetch('https://pokeapi.co/api/v2/item-attribute/holdable-active'),
    ]);
    const [d1, d2] = await Promise.all([r1.json(), r2.json()]);
    const combined = [...(d1.items || []), ...(d2.items || [])];
    const seen = new Set();
    allHoldableItems = combined
      .filter(i => { if (seen.has(i.name)) return false; seen.add(i.name); return true; })
      .map(i => ({
        name: i.name,
        displayName: i.name.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '),
        description: null // fetched lazily
      }))
      .sort((a, b) => a.displayName.localeCompare(b.displayName));
  } catch(e) {
    console.error('Could not preload holdable items:', e);
  }
}

async function fetchItemData(nameOrSlug) {
  const slug = nameOrSlug.toLowerCase().replace(/\s+/g, '-');
  const r = await fetch(`https://pokeapi.co/api/v2/item/${slug}`);
  if (!r.ok) return null;
  const data = await r.json();
  const flavorText = data.flavor_text_entries?.find(e => e.language.name === 'en');
  return {
    name: data.name,
    displayName: data.name.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '),
    description: flavorText ? flavorText.text.replace(/\n/g, ' ') : 'No description available.'
  };
}

function calculateStat(base, iv = 31, ev = 0, level = 50, isHP = false, nature = 1) {
  const evPoints = Math.min(Math.max(Number(ev) || 0, 0), 32);

  if (isHP) {
    return Math.floor(((2 * base + iv) * level) / 100) + level + 10 + evPoints;
  } else {
    const neutralStat = Math.floor(((2 * base + iv) * level) / 100) + 5 + evPoints;
    return Math.floor(neutralStat * nature);
  }
}


let statEVs = [0, 0, 0, 0, 0, 0];
let statNatureMods = [1, 1, 1, 1, 1, 1];
function cycleNatureMod(index) {
  if (index === 0) return; // HP cannot be nature-modified

  const hasUp = statNatureMods.some((mod, i) => mod === 1.1 && i !== index);
  const hasDown = statNatureMods.some((mod, i) => mod === 0.9 && i !== index);

  if (statNatureMods[index] === 1) {
    if (!hasUp) {
      statNatureMods[index] = 1.1;
    } else if (!hasDown) {
      statNatureMods[index] = 0.9;
    }
  } else if (statNatureMods[index] === 1.1) {
    if (!hasDown) {
      statNatureMods[index] = 0.9;
    } else {
      statNatureMods[index] = 1;
    }
  } else if (statNatureMods[index] === 0.9) {
    statNatureMods[index] = 1;
  }

  updateStats();
}

function getNatureIcon(index) {
  if (statNatureMods[index] === 1.1) return '<span class="nature-up">▲</span>';
  if (statNatureMods[index] === 0.9) return '<span class="nature-down">▼</span>';
  return '';
}

function toggleStatEV(index) {
  const currentEV = statEVs[index];

  // Clicking a stat with EVs clears it
  if (currentEV > 0) {
    statEVs[index] = 0;
    updateStats();
    return;
  }

  const maxedCount = statEVs.filter(ev => ev === 32).length;
  const remainderCount = statEVs.filter(ev => ev > 0 && ev < 32).length;

  // Allow two maxed stats at 32 and one remainder stat at 2
  if (maxedCount < 2) {
    statEVs[index] = 32;
  } else if (remainderCount < 1) {
    statEVs[index] = 2;
  }

  updateStats();
}


function getEVClass(index) {
  if (statEVs[index] === 32) return 'ev-maxed';
  if (statEVs[index] > 0) return 'ev-remainder';
  return '';
}


function getEVLabel(index) {
  if (statEVs[index] > 0) {
    return `<span class="ev-badge">${statEVs[index]} EV</span>`;
  }
  return '';
}


function updateStats() {
  const statNames = ['HP', 'ATTACK', 'DEFENSE', 'SP. ATK', 'SP. DEF', 'SPEED'];
  const statColors = ['#e04040', '#ff6622', '#4488ee', '#d81b60', '#7e57c2', '#f8c800'];

  const container = document.getElementById('statsContainer');
  container.innerHTML = '';

  currentPokemon.stats.forEach((stat, i) => {
    const base = stat.base_stat;
    const iv = 31;
    const level = 50;
    const nature = i === 0 ? 1 : statNatureMods[i];
    const ev = Number(statEVs[i]) || 0;
    const calculatedStat = calculateStat(base, iv, ev, level, i === 0, nature);

    const maxStat = 250;
    const percentage = Math.min((calculatedStat / maxStat) * 100, 100);
    const barColor = statColors[i];

    const row = document.createElement('div');
    row.className = 'stat-row';

    row.innerHTML = `
      <div class="stat-label ${i === 0 ? 'no-nature' : ''}"
           tabindex="${9 + i}"
           ${i === 0 ? '' : `onclick="cycleNatureMod(${i})"`}
           onkeydown="handleStatLabelKey(${i}, event)">
        <span class="stat-dot" style="background:${statColors[i]};"></span>
        ${statNames[i]} ${getNatureIcon(i)}
      </div>

      <div class="stat-val" id="stat-${i}">
        <span>${calculatedStat}</span>
        <input class="stat-input edit-overlay" type="number" min="0" max="999" value="${calculatedStat}"
          tabindex="${21 + i}"
          onfocus="this.select()"
          onclick="this.select()"
          oninput="updateStatValue(${i}, this.value)">
      </div>

      <div class="stat-bar-bg ev-click-zone ${getEVClass(i)}"
           tabindex="${15 + i}"
           onclick="toggleStatEV(${i})"
           onkeydown="handleStatEVKey(${i}, event)"
           title="Click to toggle EVs">
        <div class="stat-bar-fill" style="width:${percentage}%;background:${barColor};"></div>
        ${getEVLabel(i)}
      </div>

    `;

    container.appendChild(row);
  });
}

function updateStatValue(index, value) {
  const statVal = document.getElementById(`stat-${index}`);
  const display = statVal.querySelector('span');

  display.textContent = value;

  const bar = document.querySelectorAll('.stat-bar-fill')[index];
  const percentage = (value / 255) * 100;
  bar.style.width = `${Math.min(percentage, 100)}%`;
}

function formatMoveDetail(move) {
  const flavorText = move.flavor_text_entries.find(e => e.language.name === 'en');

  return {
    name: move.name,
    displayName: move.name.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '),
    type: move.type.name,
    damageClass: move.damage_class.name,
    power: move.power || '—',
    accuracy: move.accuracy || '—',
    description: flavorText ? flavorText.flavor_text.replace(/\n/g, ' ') : 'No description available.'
  };
}

async function fetchMoveDetail(moveRef) {
  const url = typeof moveRef === 'string' ? moveRef : moveRef.url;
  const name = typeof moveRef === 'string' ? moveRef.split('/').filter(Boolean).pop() : moveRef.name;
  const cacheKeys = [url, name].filter(Boolean);
  const cachedKey = cacheKeys.find(key => MOVE_DETAIL_CACHE.has(key));

  if (cachedKey) return MOVE_DETAIL_CACHE.get(cachedKey);

  const response = await fetch(url);
  if (!response.ok) throw new Error(`Move request failed: ${response.status} ${url}`);

  const move = await response.json();
  const formattedMove = formatMoveDetail(move);

  [url, name, move.name].filter(Boolean).forEach(key => {
    MOVE_DETAIL_CACHE.set(key, formattedMove);
  });

  return formattedMove;
}

async function mapWithConcurrency(items, limit, mapper) {
  const results = new Array(items.length);
  let nextIndex = 0;

  async function worker() {
    while (nextIndex < items.length) {
      const index = nextIndex++;
      results[index] = await mapper(items[index], index);
    }
  }

  const workerCount = Math.min(limit, items.length);
  await Promise.all(Array.from({ length: workerCount }, worker));
  return results;
}

async function loadMoves() {
  // Get all learnable moves (including level-up, TM, etc.)
  const loadedMoves = await mapWithConcurrency(
    currentPokemon.moves,
    MOVE_FETCH_CONCURRENCY,
    async moveData => {
      try {
        return await fetchMoveDetail(moveData.move);
      } catch (e) {
        console.error('Error loading move:', moveData.move.name, e);
        return null;
      }
    }
  );

  currentMoves = loadedMoves.filter(Boolean);

  // Sort moves A-Z by display name
  currentMoves.sort((a, b) =>
    a.displayName.toLowerCase().localeCompare(b.displayName.toLowerCase())
  );

  // Create move dropdowns
  for (let i = 1; i <= 4; i++) {
    createMoveSlot(i);
  }
}

async function loadMovesFromShowdown(moveSlugs) {
  const loadedMoves = await mapWithConcurrency(
    moveSlugs,
    MOVE_FETCH_CONCURRENCY,
    async slug => {
      try {
        return await fetchMoveDetail(`https://pokeapi.co/api/v2/move/${slug}`);
      } catch (e) {
        console.error('Error loading move:', slug, e);
        return null;
      }
    }
  );

  currentMoves = loadedMoves.filter(Boolean);

  // Create slots and immediately fill each one in order
  for (let i = 1; i <= 4; i++) {
    createMoveSlot(i);
    if (currentMoves[i - 1] !== undefined) {
      updateMove(i, i - 1);
    }
  }
}

function createMoveSlot(slotNum) {
  const slot = document.getElementById(`moveSlot${slotNum}`);

  slot.innerHTML = `
    <div class="move-search-wrapper edit-overlay">
      <input
        type="text"
        class="move-search-input"
        id="moveSearch${slotNum}"
        placeholder="Type to search moves..."
        tabindex="${slotNum + 2}"
        autocomplete="off"
        oninput="filterMoveDropdown(${slotNum}, this.value)"
        onfocus="openMoveDropdown(${slotNum})"
        onblur="scheduleMoveDropdownClose(${slotNum})"
        onkeydown="handleMoveSearchKey(${slotNum}, event)"
      >
      <ul class="move-dropdown-list" id="moveDropdown${slotNum}"></ul>
    </div>
    <div id="moveDisplay${slotNum}">
      <div class="move-header">
        <div class="move-icon" style="background:#e0e0e0;color:#555;">—</div>
        <div class="move-name">Select a move</div>
      </div>
    </div>
  `;

  populateMoveDropdown(slotNum, currentMoves);
}

function updateMove(slotNum, moveIndex) {
  if (moveIndex === '' || moveIndex === null || moveIndex === undefined) return;
  
  const move = currentMoves[moveIndex];
  
  // Update search input text
  const searchInput = document.getElementById(`moveSearch${slotNum}`);
  if (searchInput) searchInput.value = move.displayName;
  
  // Close dropdown
  closeMoveDropdown(slotNum);
  
  // Get offensive matchups
  const matchups = getOffensiveMatchups(move.type);
  
  const typeId = getTypeId(move.type);
  const catClass = move.damageClass === 'physical' ? 'cat-physical' : 
                   move.damageClass === 'special' ? 'cat-special' : 'cat-status';
  
  const isStatus = move.damageClass === 'status';
  
  const displayDiv = document.getElementById(`moveDisplay${slotNum}`);
  if (!displayDiv) return;

  displayDiv.innerHTML = `
    <div class="move-header">
      <div class="move-icon" style="background:#ddd;color:#555;">◎</div>
      <div class="move-name">${move.displayName}</div>
      <div class="move-badges">
        <img style="height:18px;" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-ix/scarlet-violet/${typeId}.png" alt="${move.type}">
        <span class="move-cat-badge ${catClass}">${move.damageClass.toUpperCase()}</span>
      </div>
    </div>
    <div class="move-stats-desc">
      <div class="move-pwr-acc">
        <div class="pwr-acc-block">
          <span class="pwr-acc-label">POWER</span>
          <span class="pwr-acc-val">${move.power}</span>
        </div>
        <div class="pwr-acc-block">
          <span class="pwr-acc-label">ACCURACY</span>
          <span class="pwr-acc-val">${move.accuracy}</span>
        </div>
      </div>
      <div class="move-desc-text">${move.description}</div>
    </div>
    ${isStatus ? `
      <div class="move-matchups">
        <div><div class="matchup-col-label ml-strong">STRONG AGAINST</div><div class="status-note">Status — no damage</div></div>
        <div><div class="matchup-col-label ml-resist">RESISTED BY</div></div>
        <div><div class="matchup-col-label ml-noeff">NO EFFECT</div></div>
      </div>
    ` : `
      <div class="move-matchups">
        <div>
          <div class="matchup-col-label ml-strong">STRONG AGAINST</div>
          <div class="matchup-icons">
            ${matchups.weak.map(t => `<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-ix/scarlet-violet/${getTypeId(t)}.png" alt="${t}">`).join('')}
            ${matchups.weak.length === 0 ? '<span class="no-eff-dash">—</span>' : ''}
          </div>
        </div>
        <div>
          <div class="matchup-col-label ml-resist">RESISTED BY</div>
          <div class="matchup-icons">
            ${matchups.resist.map(t => `<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-ix/scarlet-violet/${getTypeId(t)}.png" alt="${t}">`).join('')}
            ${matchups.resist.length === 0 ? '<span class="no-eff-dash">—</span>' : ''}
          </div>
        </div>
        <div>
          <div class="matchup-col-label ml-noeff">NO EFFECT</div>
          <div class="matchup-icons">
            ${matchups.immune.map(t => `<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-ix/scarlet-violet/${getTypeId(t)}.png" alt="${t}">`).join('')}
            ${matchups.immune.length === 0 ? '<span class="no-eff-dash">—</span>' : ''}
          </div>
        </div>
      </div>
    `}
  `;
}

function populateMoveDropdown(slotNum, moves) {
  const list = document.getElementById(`moveDropdown${slotNum}`);
  if (!list) return;
  if (moves.length === 0) {
    list.innerHTML = `<li style="color:#aaa;font-style:italic;cursor:default;">No moves found</li>`;
    return;
  }
  list.innerHTML = moves.map(m => {
    const actualIndex = currentMoves.indexOf(m);
    return `<li data-index="${actualIndex}" onmousedown="event.preventDefault(); selectMoveFromDropdown(${slotNum}, ${actualIndex})">${m.displayName}</li>`;
  }).join('');
}

function filterMoveDropdown(slotNum, query) {
  const filtered = !query || !query.trim()
    ? currentMoves
    : currentMoves.filter(m => m.displayName.toLowerCase().includes(query.toLowerCase().trim()));
  populateMoveDropdown(slotNum, filtered);
  const list = document.getElementById(`moveDropdown${slotNum}`);
  if (list) list.classList.add('open');
}

function openMoveDropdown(slotNum) {
  const input = document.getElementById(`moveSearch${slotNum}`);
  filterMoveDropdown(slotNum, input ? input.value : '');
}

function closeMoveDropdown(slotNum) {
  const list = document.getElementById(`moveDropdown${slotNum}`);
  if (list) list.classList.remove('open');
}

function scheduleMoveDropdownClose(slotNum) {
  setTimeout(() => closeMoveDropdown(slotNum), 150);
}

function selectMoveFromDropdown(slotNum, moveIndex) {
  updateMove(slotNum, moveIndex);
  focusNextAfterMove(slotNum);
}

function focusNextAfterMove(slotNum) {
  if (slotNum < 4) {
    const nextInput = document.getElementById(`moveSearch${slotNum + 1}`);
    if (nextInput) { nextInput.focus(); nextInput.select(); }
  } else {
    const abilitySearch = document.getElementById('abilitySearch');
    if (abilitySearch) { abilitySearch.focus(); }
  }
}

function handleMoveSearchKey(slotNum, event) {
  const list = document.getElementById(`moveDropdown${slotNum}`);
  const items = getSelectableDropdownItems(list);
  const highlightedItem = getHighlightedDropdownItem(list);

  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    if (moveDropdownHighlight(list, event.key === 'ArrowDown' ? 1 : -1)) {
      event.preventDefault();
    }
  } else if (event.key === 'Enter') {
    event.preventDefault();
    if (highlightedItem || items.length === 1) {
      const moveIndex = parseInt((highlightedItem || items[0]).dataset.index);
      selectMoveFromDropdown(slotNum, moveIndex);
    }
  } else if (event.key === 'Tab') {
    if (highlightedItem || items.length === 1) {
      // Auto-select the only remaining match, then advance focus
      event.preventDefault();
      const moveIndex = parseInt((highlightedItem || items[0]).dataset.index);
      selectMoveFromDropdown(slotNum, moveIndex);
    } else {
      // Just close and let Tab advance naturally
      closeMoveDropdown(slotNum);
    }
  } else if (event.key === 'Escape') {
    event.preventDefault();
    closeMoveDropdown(slotNum);
  }
}

function handleStatLabelKey(index, event) {
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    if (index !== 0) {
      cycleNatureMod(index); // updateStats() rebuilds DOM, focus is lost
      // Re-focus the same label after rebuild
      document.querySelectorAll('.stat-label')[index]?.focus();
    }
  }
}

function handleStatEVKey(index, event) {
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    toggleStatEV(index); // updateStats() rebuilds DOM, focus is lost
    // Re-focus the same EV bar after rebuild
    document.querySelectorAll('.ev-click-zone')[index]?.focus();
  }
}

function getOffensiveMatchups(attackType) {
  return TYPE_CHART[attackType] || { weak: [], resist: [], immune: [] };
}

function updateDefensiveMatchups() {
  const types = currentPokemon.types.map(t => TYPE_ID_MAP[t.type.url.split('/')[6]]);
  
  // Calculate defensive matchups
  const effectiveness = {};
  
  // Initialize all types as 1x
  Object.keys(TYPE_ID_MAP).forEach(id => {
    effectiveness[TYPE_ID_MAP[id]] = 1;
  });
  
  // Calculate for each attacking type
  Object.keys(TYPE_CHART).forEach(attackType => {
    let multiplier = 1;
    
    types.forEach(defenseType => {
      if (TYPE_CHART[attackType].weak.includes(defenseType)) {
        multiplier *= 2;
      }
      if (TYPE_CHART[attackType].resist.includes(defenseType)) {
        multiplier *= 0.5;
      }
      if (TYPE_CHART[attackType].immune.includes(defenseType)) {
        multiplier *= 0;
      }
    });
    
    effectiveness[attackType] = multiplier;
  });
  
  // Group by effectiveness
  const weak = [];
  const resist = [];
  const immune = [];
  
  Object.entries(effectiveness).forEach(([type, mult]) => {
    if (mult > 1) weak.push(type);
    else if (mult < 1 && mult > 0) resist.push(type);
    else if (mult === 0) immune.push(type);
  });
  
  // Render
  const container = document.getElementById('defensiveMatchups');
  container.innerHTML = `
    ${weak.length > 0 ? `
      <div class="def-matchup-block">
        <div class="def-matchup-header weak-header">
          WEAK TO<span class="def-matchup-sub">(Takes more damage)</span>
        </div>
        <div class="def-matchup-types">
          ${weak.map(t => `<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-ix/scarlet-violet/${getTypeId(t)}.png" alt="${t}">`).join('')}
        </div>
      </div>
    ` : ''}
    
    ${resist.length > 0 ? `
      <div class="def-matchup-block">
        <div class="def-matchup-header resist-header">
          RESISTANT<span class="def-matchup-sub">(Takes less damage)</span>
        </div>
        <div class="def-matchup-types">
          ${resist.map(t => `<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-ix/scarlet-violet/${getTypeId(t)}.png" alt="${t}">`).join('')}
        </div>
      </div>
    ` : ''}
    
    ${immune.length > 0 ? `
      <div class="def-matchup-block" style="margin-bottom:0;">
        <div class="def-matchup-header immune-header">
          IMMUNE<span class="def-matchup-sub">(No damage)</span>
        </div>
        <div class="def-matchup-types">
          ${immune.map(t => `<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-ix/scarlet-violet/${getTypeId(t)}.png" alt="${t}">`).join('')}
        </div>
      </div>
    ` : ''}
  `;
}
</script>
